name: Linters

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install required packages
      run: |
        sudo apt-get install -y portaudio19-dev libasound-dev

    - name: Validate the pyproject.toml
      run: |
        poetry check

    - name: Verify poetry.lock consistency
      run: |
        poetry check --lock

    - name: Install dependencies
      run: |
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-root
        pip install types-protobuf

    - name: Check code
      run: |
        poetry run ruff check
        poetry run ruff format --check --quiet
        poetry run mypy .

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install required packages
      run: |
        sudo apt-get install -y portaudio19-dev libasound-dev

    - name: Install dependencies
      run: |
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-root

    # tests/conftest.py pins the configuration; the integration suite starts
    # its own PostgreSQL and Manticore containers through testcontainers
    - name: Run unit and integration tests with coverage
      run: |
        coverage run -m pytest -p no:sugar
        coverage report

    - name: Publish coverage badge
      uses: py-cov-action/python-coverage-comment-action@v4.6
      with:
        GITHUB_TOKEN: ${{ github.token }}

  frontend:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tracker
      DB_USERNAME: tracker
      DB_PASSWORD: tracker
      DRIVE_CREDS: '{}'
      MANTICORE_MYSQL_HOST: localhost
      BACKUP_HOST: localhost
      BACKUP_PORT: 50051
      YOUTUBE_API_KEY: dummy
      KAFKA_REPEAT_NOTES_TOPIC: repeat
      KAFKA_CACHE_NOTES_TOPIC: cache
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.14'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install required packages
      run: |
        sudo apt-get install -y portaudio19-dev libasound-dev

    - name: Install backend dependencies
      run: |
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-root

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Check the generated API client is up to date
      run: |
        make gen-api
        git diff --exit-code frontend/openapi.json frontend/src/api/schema.ts

    - name: Typecheck and test
      working-directory: frontend
      run: |
        npm run typecheck
        npm test
